<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RegenMed Document Reviewer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="wrap">
  <header>
    <h1>RegenMed Document Reviewer</h1>
    <p class="sub">Upload a filled processing form (PDF). The reviewer detects the form type
    and flags missing or inconsistent fields.</p>
  </header>

  {% if error %}
  <div class="alert">{{ error }}</div>
  {% endif %}

  <form action="{{ url_for('review') }}" method="post" enctype="multipart/form-data" class="upload">
    <label class="drop" for="pdf">Choose PDF file(s)…</label>
    <input type="file" id="pdf" name="pdf" accept=".pdf,application/pdf" multiple required>
    <span class="fname" id="fname"></span>
    <button type="submit">Review document(s)</button>
  </form>
  <p class="hint">Tip: select multiple PDFs at once for a batch summary report.</p>
</main>
<script>
document.getElementById('pdf').addEventListener('change', function (e) {
  var n = e.target.files.length;
  document.getElementById('fname').textContent =
    n === 1 ? e.target.files[0].name : n + ' files selected';
});
</script>
</body>
</html>
